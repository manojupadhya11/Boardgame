# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

  workflow_dispatch:

jobs:

  compile:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-Repo
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: java --version

      - name: Compile
        run: mvn compile
        
  Test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: checkout-Repo
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: java --version

      - name: Test
        run: mvn test
       

  Build:
    runs-on: ubuntu-latest
    needs:
      - compile
      - Test

    steps:
      - name: checkout-Repo
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: java --version

      - name: Compile
        run: mvn package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: java-application
          path: target/*.jar

      
        
 
